name: Build OneAI Android

on:
  workflow_dispatch:
  push:
    branches:
      - main

jobs:
  build-android:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout OneAI
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build web app
        run: npm run build

      - name: Sync Capacitor Android
        run: npx cap sync android

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Android SDK packages
        run: |
          sdkmanager "platforms;android-36" "build-tools;36.0.0"

      - name: Check signing secrets
        env:
          KEYSTORE_BASE64: ${{ secrets.ONEAI_RELEASE_KEYSTORE }}
          KEYSTORE_PASSWORD: ${{ secrets.ONEAI_KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.ONEAI_KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.ONEAI_KEY_PASSWORD }}
        run: |
          test -n "$KEYSTORE_BASE64" || {
            echo "ERROR: ONEAI_RELEASE_KEYSTORE is empty or unavailable."
            exit 1
          }

          test -n "$KEYSTORE_PASSWORD" || {
            echo "ERROR: ONEAI_KEYSTORE_PASSWORD is empty or unavailable."
            exit 1
          }

          test -n "$KEY_ALIAS" || {
            echo "ERROR: ONEAI_KEY_ALIAS is empty or unavailable."
            exit 1
          }

          test -n "$KEY_PASSWORD" || {
            echo "ERROR: ONEAI_KEY_PASSWORD is empty or unavailable."
            exit 1
          }

          echo "All four signing secrets are available."

      - name: Restore release keystore
        env:
          KEYSTORE_BASE64: ${{ secrets.ONEAI_RELEASE_KEYSTORE }}
        run: |
          echo "Restoring release keystore..."

          printf '%s' "$KEYSTORE_BASE64" | base64 --decode > android/oneai-release.keystore

          test -s android/oneai-release.keystore

          echo "Release keystore restored."
          ls -l android/oneai-release.keystore

      - name: Validate release keystore
        env:
          KEYSTORE_PASSWORD: ${{ secrets.ONEAI_KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.ONEAI_KEY_ALIAS }}
        run: |
          echo "Validating release keystore..."

          keytool -list \
            -keystore android/oneai-release.keystore \
            -storepass "$KEYSTORE_PASSWORD" \
            -alias "$KEY_ALIAS" \
            >/dev/null

          echo "Release keystore and alias validated successfully."

      - name: Create signing properties
        env:
          KEYSTORE_PASSWORD: ${{ secrets.ONEAI_KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.ONEAI_KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.ONEAI_KEY_PASSWORD }}
        run: |
          cat > android/key.properties <<EOF
          storeFile=oneai-release.keystore
          storePassword=$KEYSTORE_PASSWORD
          keyAlias=$KEY_ALIAS
          keyPassword=$KEY_PASSWORD
          EOF

          echo "key.properties created."
          test -s android/key.properties

      - name: Verify signing files
        run: |
          echo "Checking signing files..."
          test -s android/key.properties
          test -s android/oneai-release.keystore
          echo "Signing files verified."

      - name: Build release APK
        working-directory: android
        run: ./gradlew assembleRelease --no-daemon

      - name: Build release AAB
        working-directory: android
        run: ./gradlew bundleRelease --no-daemon

      - name: Inspect APK permissions
        run: |
          $ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager --list >/dev/null 2>&1 || true
          APK="android/app/build/outputs/apk/release/app-release.apk"
          AAPT2=$(find "$ANDROID_HOME/build-tools" -name aapt2 -type f | sort -V | tail -1)
          echo "Using AAPT2: $AAPT2"
          "$AAPT2" dump permissions "$APK"

      - name: Upload OneAI release APK
        uses: actions/upload-artifact@v4
        with:
          name: OneAI-release-apk
          path: android/app/build/outputs/apk/release/app-release.apk
          if-no-files-found: error

      - name: Upload OneAI Play Store AAB
        uses: actions/upload-artifact@v4
        with:
          name: OneAI-release-aab
          path: android/app/build/outputs/bundle/release/app-release.aab
          if-no-files-found: error
