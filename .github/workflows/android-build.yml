
name: Build Android Release

on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  build-apk:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build web app
        run: npm run build

      - name: Sync Capacitor Android
        run: npx cap sync android

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Android SDK packages
        run: |
          sdkmanager "platforms;android-36" "build-tools;36.0.0"

      - name: Restore release keystore
        env:
          KEYSTORE_BASE64: ${{ secrets.ONEAI_RELEASE_KEYSTORE }}
        run: |
          test -n "$KEYSTORE_BASE64"
          printf '%s' "$KEYSTORE_BASE64" | tr -d '[:space:]' | base64 --decode > android/oneai-play-release.keystore
          test -s android/oneai-play-release.keystore

      - name: Create signing properties
        env:
          KEYSTORE_PASSWORD: ${{ secrets.ONEAI_KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.ONEAI_KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.ONEAI_KEY_PASSWORD }}
        run: |
          test -n "$KEYSTORE_PASSWORD"
          test -n "$KEY_ALIAS"
          test -n "$KEY_PASSWORD"

          cat > android/key.properties <<EOF
          storeFile=oneai-play-release.keystore
          storePassword=$KEYSTORE_PASSWORD
          keyAlias=$KEY_ALIAS
          keyPassword=$KEY_PASSWORD
          EOF

          test -f android/key.properties

      - name: Verify signing files
        run: |
          test -s android/oneai-play-release.keystore
          test -f android/key.properties
          echo "Signing files are present."

      - name: Build release APK
        working-directory: android
        run: ./gradlew assembleRelease --no-daemon

      - name: Upload OneAI release APK
        uses: actions/upload-artifact@v4
        with:
          name: OneAI-release-apk
          path: android/app/build/outputs/apk/release/app-release.apk
          if-no-files-found: error
