name: Build Android Release

on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  build-apk:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build web app
        run: npm run build

      - name: Sync Capacitor Android
        run: npx cap sync android

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Android SDK packages
        run: |
          sdkmanager "platforms;android-36" "build-tools;36.0.0"

      - name: Check signing secrets
        env:
          KEYSTORE_BASE64: ${{ secrets.ONEAI_RELEASE_KEYSTORE }}
          KEYSTORE_PASSWORD: ${{ secrets.ONEAI_KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.ONEAI_KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.ONEAI_KEY_PASSWORD }}
        run: |
          test -n "$KEYSTORE_BASE64" || {
            echo "ERROR: ONEAI_RELEASE_KEYSTORE is missing"
            exit 1
          }

          test -n "$KEYSTORE_PASSWORD" || {
            echo "ERROR: ONEAI_KEYSTORE_PASSWORD is missing"
            exit 1
          }

          test -n "$KEY_ALIAS" || {
            echo "ERROR: ONEAI_KEY_ALIAS is missing"
            exit 1
          }

          test -n "$KEY_PASSWORD" || {
            echo "ERROR: ONEAI_KEY_PASSWORD is missing"
            exit 1
          }

          echo "All signing secrets are available."

      - name: Restore release keystore
        env:
          KEYSTORE_BASE64: ${{ secrets.ONEAI_RELEASE_KEYSTORE }}
        run: |
          echo "$KEYSTORE_BASE64" | base64 --decode > android/oneai-release.keystore
          test -s android/oneai-release.keystore
          echo "Keystore restored."

      - name: Create signing properties
        env:
          KEYSTORE_PASSWORD: ${{ secrets.ONEAI_KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.ONEAI_KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.ONEAI_KEY_PASSWORD }}
        run: |
          cat > android/key.properties <<EOF
          storeFile=oneai-release.keystore
          storePassword=$KEYSTORE_PASSWORD
          keyAlias=$KEY_ALIAS
          keyPassword=$KEY_PASSWORD
          EOF

          test -s android/key.properties
          echo "key.properties created."

      - name: Build release APK
        working-directory: android
        run: ./gradlew assembleRelease --no-daemon

      - name: Build Play Store AAB
        working-directory: android
        run: ./gradlew bundleRelease --no-daemon

      - name: Upload release APK
        uses: actions/upload-artifact@v4
        with:
          name: OneAI-release-apk
          path: android/app/build/outputs/apk/release/app-release.apk
          if-no-files-found: error

      - name: Upload Play Store AAB
        uses: actions/upload-artifact@v4
        with:
          name: OneAI-release-aab
          path: android/app/build/outputs/bundle/release/app-release.aab
          if-no-files-found: error
